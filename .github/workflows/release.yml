# On main: when VERSION has no tag yet, create tag vX.Y.Z and a GitHub release with the notes from the CHANGELOG in index.html.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/version.mjs check
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V already released"; exit 0; fi
          node scripts/version.mjs notes "$V" > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "QS CRM v$V" --notes-file notes.md
          echo "Released v$V"
